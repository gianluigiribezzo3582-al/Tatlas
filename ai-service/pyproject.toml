[project]
name = "tatlas-ai-service"
version = "0.1.0"
description = "Embedding service for Tatlas (text: multilingual-e5-small, image/text: SigLIP 2)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]
# Phase 2: model runtime (kept optional so Phase 1 images stay small)
ml = [
    "torch>=2.5",
    "transformers>=4.49",
    "sentence-transformers>=3.3",
    "pillow>=11.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
