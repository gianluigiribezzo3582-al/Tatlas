name: android-apk

# Builds a standalone test APK (JS bundled, no Metro, no Expo account needed)
# and uploads it as a workflow artifact. Signed with the default debug keystore:
# for sideloading on test phones only, not for the Play Store (use EAS for that).

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Default API URL baked into the APK (can be changed in the app Settings)"
        required: false
        default: "http://192.168.1.20:8000/api/v1"
  push:
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || 'http://192.168.1.20:8000/api/v1' }}
      TATLAS_ALLOW_CLEARTEXT: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK (arm64)
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Rename APK
        run: |
          SHA=$(git rev-parse --short HEAD)
          mv android/app/build/outputs/apk/release/app-release.apk "tatlas-${SHA}.apk"
          ls -la tatlas-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tatlas-apk
          path: mobile/tatlas-*.apk
          retention-days: 14
